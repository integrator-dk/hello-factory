name: release

# Build, test and publish the image to Factory's registry, then tell Factory that a new
# version is ready (standards/cicd in integrator-dk/factory). Factory decides when it is deployed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # GitHub OIDC: push to Factory's ACR and register with Factory; no secrets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from factory.yaml
        id: version
        run: echo "version=$(grep -m1 -E '^  version:' factory.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: python -m unittest -v

      - name: Azure login (OIDC, push identity id-hello-factory-push)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Build, smoke test and push image
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          az acr login -n "${{ vars.FACTORY_ACR }}"
          IMAGE="${{ vars.FACTORY_ACR }}.azurecr.io/hello-factory"
          docker build --build-arg VERSION="$VERSION" -t "$IMAGE:$VERSION" .
          docker run -d --name smoke -p 8080:8080 "$IMAGE:$VERSION"
          for i in $(seq 1 10); do curl -fs localhost:8080/healthz && break; sleep 1; done
          docker rm -f smoke
          docker push "$IMAGE:$VERSION"
          echo "image=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$VERSION")" >> "$GITHUB_OUTPUT"

      - name: Register release with Factory
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          set -o pipefail  # a rejected registration must fail the job (the response is piped to jq)
          TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://factory.integrator.dk" | jq -r .value)
          # factory.yaml ships with the version (ADR-0013): it applies in Factory when the version goes live.
          jq -n --arg v "$VERSION" --arg i "$IMAGE" --arg n "$(git log -1 --pretty=%B)" --rawfile m factory.yaml \
            '{solution:"hello-factory", version:$v, image:$i, notes:$n, manifest:$m}' |
          curl -sS --fail-with-body -X POST https://factory.integrator.dk/api/releases/register \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d @- | jq .
